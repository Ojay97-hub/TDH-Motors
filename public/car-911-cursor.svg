<svg xmlns="http://www.w3.org/2000/svg" width="40" height="20" viewBox="0 0 64 32">
  <!-- Porsche 911 side-profile silhouette (fastback roofline) -->
  <g stroke="#0f2a1f" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
    <!-- tyres (drawn first so the arch cut-outs reveal them) -->
    <circle cx="16" cy="23.5" r="5.6" fill="#0f2a1f"/>
    <circle cx="48" cy="23.5" r="5.6" fill="#0f2a1f"/>
    <circle cx="16" cy="23.5" r="2.1" fill="#e7e2d8" stroke="none"/>
    <circle cx="48" cy="23.5" r="2.1" fill="#e7e2d8" stroke="none"/>
    <!-- body: long low nose, raked screen, flat roof, sloping fastback rear -->
    <path fill="#f5f3ee" d="
      M3,20
      C3,18.4 4,17.6 6.4,17.4
      L18.5,16
      L25,9.6
      C27.5,7.2 31.5,6.4 37,6.6
      C45,6.9 51,9.4 56,15.2
      L58.8,18.4
      C60.4,18.7 61,19.4 61,20.8
      L61,21.6
      L53.5,21.6
      A5.6,5.6 0 0 0 42.5,21.6
      L21.5,21.6
      A5.6,5.6 0 0 0 10.5,21.6
      L3,21.6
      Z"/>
    <!-- side glass to read as a 911 greenhouse -->
    <path fill="#0f2a1f" stroke="none" d="
      M24.5,10.6
      C27,8.6 30.5,8 36,8.2
      C42,8.4 46.5,10 50,13.6
      L26.5,13.6
      Z"/>
  </g>
</svg>
